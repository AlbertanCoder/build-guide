<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Step 8: Test in sequence before controlled flights</title>
<desc id="desc">A six-stage sequence: unit tests, demo map, GPS fix, power and motor checks, first hover, and controlled hot-plate detection tests. Never test at a wildfire.</desc>
<rect width="960" height="540" fill="#f7f2e8"/>
<style>.t{font:700 21px 'Segoe UI',sans-serif;fill:#123a2e}.s{font:16px 'Segoe UI',sans-serif;fill:#21332b}.b{fill:#fff;stroke:#1b5e4f;stroke-width:3;rx:14}.a{fill:#e4f0ea;stroke:#1b5e4f;stroke-width:3;rx:14}.w{fill:#fbe9dc;stroke:#c2571b;stroke-width:3;rx:14}.g{stroke:#1b5e4f;stroke-width:4;fill:none}</style>
<text x="32" y="40" class="t">8 · Prove each stage before moving to the next</text>
<rect x="40" y="75" width="260" height="120" class="a"/><text x="170" y="110" text-anchor="middle" class="t">A · SOFTWARE</text><text x="170" y="142" text-anchor="middle" class="s">19/19 unit tests</text><text x="170" y="172" text-anchor="middle" class="s">Demo + map API</text>
<rect x="350" y="75" width="260" height="120" class="a"/><text x="480" y="110" text-anchor="middle" class="t">B · BENCH</text><text x="480" y="142" text-anchor="middle" class="s">I2C + GPS fix</text><text x="480" y="172" text-anchor="middle" class="s">5V under load</text>
<rect x="660" y="75" width="260" height="120" class="a"/><text x="790" y="110" text-anchor="middle" class="t">C · RADIO / FPV</text><text x="790" y="142" text-anchor="middle" class="s">Bind + failsafe</text><text x="790" y="172" text-anchor="middle" class="s">Video + legal channel</text>
<path d="M300 135 H350 M610 135 H660" class="g"/>
<rect x="40" y="245" width="260" height="120" class="b"/><text x="170" y="280" text-anchor="middle" class="t">D · PROPS OFF</text><text x="170" y="312" text-anchor="middle" class="s">Motor order + direction</text><text x="170" y="342" text-anchor="middle" class="s">Smoke-stopper first power</text>
<rect x="350" y="245" width="260" height="120" class="b"/><text x="480" y="280" text-anchor="middle" class="t">E · FIRST HOVER</text><text x="480" y="312" text-anchor="middle" class="s">Legal open site</text><text x="480" y="342" text-anchor="middle" class="s">1 m, land, inspect</text>
<rect x="660" y="245" width="260" height="120" class="b"/><text x="790" y="280" text-anchor="middle" class="t">F · HOT PLATE</text><text x="790" y="312" text-anchor="middle" class="s">Hot + cold controls</text><text x="790" y="342" text-anchor="middle" class="s">Measure errors, repeat</text>
<path d="M300 305 H350 M610 305 H660" class="g"/>
<rect x="150" y="415" width="660" height="75" class="w"/><text x="480" y="448" text-anchor="middle" class="t">Do not test at a real wildfire</text><text x="480" y="477" text-anchor="middle" class="s">Registration + certificate + VLOS + airspace/NOTAM/site checks</text>
</svg>