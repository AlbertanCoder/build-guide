<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Walkthrough</title>
<link rel="icon" type="image/svg+xml" href="../../shad-drone-icon.svg">
<link rel="icon" href="../icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  :root { --bg:#eef1f4; --panel:#ffffff; --ink:#1d2329; --soft:#5b6670; --accent:#0a6cff; --line:#d5dbe1; --good:#137a3a; --bad:#c81e1e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --panel:#1d2329; --ink:#e9edf1; --soft:#9aa6b1; --accent:#5aa2ff; --line:#323b44; --good:#3fbf6f; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
  /* the frame keeps clear of the iPhone's home bar and, with the phone on its side, of the notch */
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--panel); padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header a, header button { color:var(--accent); text-decoration:none; background:none; border:0; font:inherit; font-size:14px; cursor:pointer; padding:6px 4px; }
  #where { flex:1; min-width:0; }
  #where .grp { font-size:12px; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #where .ttl { font-weight:700; }   /* PHONES P4: a long title wraps instead of being cut with "..." (it was cut on tablets) */
  /* Final audit, 11 Nov 2026 (NEW-3): on a phone the title gets its own line under the buttons and may wrap. */
  @media (max-width: 600px) {
    header { flex-wrap:wrap; row-gap:0; }
    #where { order:5; flex:1 1 100%; }
    #where .ttl { white-space:normal; }
    #saved { margin-left:auto; }
  }
  #bar { height:4px; background:var(--line); } #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  /* Final audit, 11 Nov 2026 (PICS P3): the picture keeps at least 40 % of the screen's height; long words scroll in their own box. */
  #stage { position:relative; flex:1; min-height:40vh; overflow:hidden; }
  /* PHONES P5: on a very short upright phone the words get one more line */
  @media (max-height: 620px) and (orientation: portrait) { #stage { min-height:34vh; } }
  #stage canvas { display:block; width:100%; height:100%; touch-action:none; }
  .tag { position:absolute; transform:translate(-50%,-100%); background:#101820e6; color:#fff; font-size:13px; font-weight:600; padding:4px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; margin-top:-10px; z-index:2; }
  /* Final audit, 11 Nov 2026 (NEW-4): on a narrow screen a long label may wrap, so it can stay inside the picture. */
  @media (max-width: 600px) { .tag { white-space:normal; width:max-content; max-width:92vw; text-align:center; } }
  .tag::after { content:""; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:#101820e6; }
  .tag.red { background:#c81e1ee6; } .tag.red::after { border-top-color:#c81e1ee6; }
  .tag.good { background:#137a3ae6; } .tag.good::after { border-top-color:#137a3ae6; }
  .tag.warn { background:#b45a00e6; } .tag.warn::after { border-top-color:#b45a00e6; }
  .tag.blue { background:#0a6cffe6; } .tag.blue::after { border-top-color:#0a6cffe6; }
  .card { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#0d1218b3; z-index:5; padding:16px; }
  .card.on { display:flex; }
  .card .box { background:var(--panel); color:var(--ink); border-radius:14px; padding:18px; width:min(560px,100%); max-height:100%; overflow:auto; box-shadow:0 10px 40px #0006; }
  .box h2 { margin:0 0 6px; font-size:19px; } .box .sub { color:var(--soft); font-size:13px; margin-bottom:12px; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border-radius:10px; border:2px solid var(--line); background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--accent); }
  .opt.right { border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, transparent); }
  .opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, transparent); }
  .opt:disabled { cursor:default; }
  .fb { margin:10px 0 4px; font-size:15px; } .fb.right { color:var(--good); } .fb.wrong { color:var(--bad); }
  .btn { border:0; border-radius:10px; padding:11px 16px; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .btn:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  #panel { background:var(--panel); border-top:1px solid var(--line); padding:10px 16px 0; max-height:56vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  /* Final audit, 11 Nov 2026 (PHONES D1): Play, the step buttons and Back / Next stay on the screen; long words scroll above them. */
  #dock { position:sticky; bottom:0; z-index:1; background:var(--panel); margin:0 -16px; padding:6px 16px 10px; }
  #cap { font-size:17px; min-height:3em; margin-bottom:8px; } #cap b { color:var(--accent); }
  #cap .why { font-size:14px; color:var(--soft); margin-top:4px; } #cap .why b { color:var(--soft); }
  #cap .term { border-bottom:2px dotted var(--accent); cursor:help; }
  #cap .more { color:var(--accent); cursor:pointer; margin-left:6px; white-space:nowrap; }
  #cap .moretext { font-size:14px; margin-top:4px; }
  #cap img.stepphoto { display:block; max-height:120px; max-width:100%; margin-top:6px; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; }
  #termPop { position:fixed; z-index:9; max-width:320px; background:#101820; color:#fff; padding:8px 10px; border-radius:8px; font-size:14px; display:none; box-shadow:0 6px 20px #0006; }
  #photoView { position:fixed; inset:0; z-index:9; background:#000c; display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #photoView img { max-width:94vw; max-height:90vh; border-radius:8px; }
  #cap .simple { font-size:15px; margin-top:6px; padding:8px 10px; border-radius:8px; background:color-mix(in srgb, var(--accent) 10%, transparent); }
  #ctl { display:flex; gap:10px; align-items:center; }
  #play { width:44px; height:44px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  #scrub { flex:1; accent-color:var(--accent); height:30px; min-width:60px; }
  #time { font-variant-numeric:tabular-nums; color:var(--soft); font-size:13px; width:52px; text-align:right; flex:none; }
  #steps { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #steps button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:16px; padding:4px 11px; font-size:13px; cursor:pointer; }
  #steps button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #nav { display:flex; gap:8px; margin-top:10px; } #nav .btn { flex:1; }
  #hint { color:var(--soft); font-size:12px; padding-bottom:10px; }
  /* PHONES D2: on a phone the step buttons are one row that scrolls sideways; bigger touch areas on a touch screen. */
  @media (max-width: 600px), (max-height: 520px) {
    #steps { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    #steps::-webkit-scrollbar { display:none; }
    #steps button { flex:none; }
  }
  @media (pointer: coarse) {
    #steps button { padding:9px 13px; }
    header a, header button { padding:11px 6px; }
  }
  /* PHONES D3: a phone on its side: the picture on the left, the words and buttons on the right. */
  @media (orientation: landscape) and (max-height: 520px) {
    #wrap { display:grid; grid-template-columns:minmax(0, 1fr) minmax(300px, 44%); grid-template-rows:auto auto minmax(0, 1fr); }
    #wrap > header, #bar { grid-column:1 / -1; }
    #stage { min-height:0; }
    #panel { max-height:none; border-top:0; border-left:1px solid var(--line); }
  }
  #list { position:absolute; inset:0; z-index:6; background:var(--bg); overflow:auto; display:none; padding:12px 16px; }
  #list.on { display:block; }
  /* Final audit, 11 Nov 2026 (PHONES): while "All lessons" is open it gets the whole screen under the header (on a small
     phone it was a 230 px window above the words and buttons). */
  #wrap:has(#list.on) #panel { display:none; }
  #list h3 { font-size:13px; color:var(--soft); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; }
  #list button { display:flex; gap:10px; width:100%; text-align:left; padding:10px 12px; margin:4px 0; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; }
  #list button:disabled { opacity:.5; cursor:not-allowed; }
  #list button.here { border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
  #list .ico { width:22px; flex:none; text-align:center; }
  #loading { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--soft); }
</style>
</head>
<body>
<div id="termPop"></div><div id="photoView"><img alt="Photo"></div>
<div id="wrap">
  <header>
    <a href="../../index.html" title="Back to the guide">&larr; Guide</a>
    <div id="where"><div class="grp" id="grp"></div><div class="ttl" id="ttl">Build walkthrough</div></div>
    <span id="saved" style="font-size:12px;color:var(--soft);white-space:nowrap"></span>
    <button id="openList">All lessons</button>
  </header>
  <div id="bar"><i></i></div>
  <div id="stage">
    <div id="loading">Loading&hellip;</div>
    <div class="card" id="endCard"><div class="box">
      <h2 id="endTitle">Done</h2><div class="sub" id="endSub"></div>
      <div class="row"><button class="btn ghost" id="again">Watch again</button><button class="btn ghost" id="dunnoEnd">? I don't understand the last step</button><button class="btn" id="endNext">Next &rarr;</button></div>
    </div></div>
    <div class="card" id="quizCard"><div class="box" id="quizBox"></div></div>
    <div id="list"></div>
  </div>
  <div id="panel">
    <div id="cap"></div>
    <div id="dock">
    <div id="ctl">
      <button id="play" aria-label="Play or pause">&#10074;&#10074;</button>
      <button id="doneStep" class="btn" style="display:none;flex:none">&#10003; I understand, next step</button>
      <button id="dunno" class="btn ghost" style="display:none;flex:none">? I don't understand</button>
      <input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Scrub">
      <div id="time">0.0 s</div>
    </div>
    <div id="steps"></div>
    <div id="nav"><button class="btn ghost" id="prev">&larr; Back</button><button class="btn" id="next">Next &rarr;</button></div>
    </div>
    <div id="hint"><label style="margin-right:12px"><input type="checkbox" id="straight"> Play straight through</label>Pause, then drag to look around. Shapes are simplified and not exact sizes; the words in the guide are the rule.</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js" } }
</script>
<script type="module">
import * as E from "./engine.js";
import { SEQ } from "./lessons/index.js";
import { GLOSSARY } from "./glossary.js";
const { THREE, V, ease } = E;

const $ = id => document.getElementById(id);
const errors = [];
addEventListener("error", e => errors.push(String(e.message)));
addEventListener("unhandledrejection", e => errors.push(String(e.reason)));

/* ---------- saved progress (this device only) ---------- */
const KEY = "walkthrough-progress-v1";
let prog = { at: SEQ[0].id, passed: {}, watched: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.passed) prog = { ...prog, ...s }; } catch (e) {}
/* Progress is saved twice: in this browser, and on the guide's own server (/api/progress, the same store the Build
   page's ticks use), so Edge, Chrome and a paired phone all share one save. Keys: wt:pass:<quiz>, wt:watched:<lesson>,
   wt:at:<item> (newest = where you are), wt:step:<n> (newest = the step inside that lesson). */
let synced = null, pendingSync = {}, syncTimer = 0;
function syncHeaders(extra) {
  const h = Object.assign({ "content-type": "application/json" }, extra || {});
  try { const t = localStorage.getItem("ga-write-token"); if (t) h["x-write-token"] = t; const d = localStorage.getItem("ga-device-token"); if (d) h["x-device-token"] = d; } catch (e) {}
  return h;
}
function queueSync(k) { pendingSync[k] = { v: true, at: Date.now() }; clearTimeout(syncTimer); syncTimer = setTimeout(flushSync, 400); }
function flushSync() {
  const changes = pendingSync; pendingSync = {};
  if (!Object.keys(changes).length || synced === false) return;   // no guide server here (e.g. the public copy): this browser only
  fetch("/api/progress", { method: "POST", headers: syncHeaders(), body: JSON.stringify({ changes }) })
    .then(r => { synced = r.ok; showSaved(); }, () => { synced = false; showSaved(); });
}
function showSaved() { const el = document.getElementById("saved"); if (el) el.textContent = synced ? "Saved ✓ (all your devices)" : "Saved ✓ (this browser)"; }
let lastPushed = { at: "", step: -1 };
const save = () => {
  prog.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {}
  Object.keys(prog.passed).forEach(q => { if (!lastPushed["p:" + q]) { lastPushed["p:" + q] = 1; queueSync("wt:pass:" + q); } });
  Object.keys(prog.watched).forEach(w => { if (!lastPushed["w:" + w]) { lastPushed["w:" + w] = 1; queueSync("wt:watched:" + w); } });
  if (prog.at !== lastPushed.at) { lastPushed.at = prog.at; queueSync("wt:at:" + prog.at); }
  if ((prog.step || 0) !== lastPushed.step) { lastPushed.step = prog.step || 0; queueSync("wt:step:" + (prog.step || 0)); }
  showSaved();
};
/** read the shared save and merge it in: passes are added, never removed; the newest position wins */
async function pullSaved() {
  /* Final audit, 11 Nov 2026: the public copy (GitHub Pages) has no guide server, so do not ask it: the request could
     only fail (a 404 on every visit). Progress there is kept in this browser, and the header says so. */
  if (window.GUIDE_FORCE_PUBLIC === true || /(^|\.)github\.io$/i.test(location.hostname)) { synced = false; return; }
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2000);
    const r = await fetch("/api/progress", { cache: "no-store", headers: syncHeaders(), signal: ctl.signal });
    if (!r.ok) { synced = false; return; }
    const ticks = (await r.json()).ticks || {};
    let at = null, step = null, dropped = 0;
    const mine = prog.savedAt || 0;   // when this browser last saved its own copy
    for (const [k, t] of Object.entries(ticks)) {
      if (!t) continue;
      if (!t.v) {
        /* The shared save says "not earned", and says it more recently than this browser's own copy was saved:
           this copy is stale (for example passes left by a test run), so drop it here instead of sending it back.
           (Fable audit, 10 Nov 2026, finding M1.) */
        if (t.at > mine) {
          if (k.startsWith("wt:pass:") && prog.passed[k.slice(8)]) { delete prog.passed[k.slice(8)]; dropped++; }
          else if (k.startsWith("wt:watched:") && prog.watched[k.slice(11)]) { delete prog.watched[k.slice(11)]; dropped++; }
        }
        continue;
      }
      if (k.startsWith("wt:pass:")) { prog.passed[k.slice(8)] = true; lastPushed["p:" + k.slice(8)] = 1; }
      else if (k.startsWith("wt:watched:")) { prog.watched[k.slice(11)] = true; lastPushed["w:" + k.slice(11)] = 1; }
      else if (k.startsWith("wt:at:") && (!at || t.at > at.at)) at = { id: k.slice(6), at: t.at };
      else if (k.startsWith("wt:step:") && (!step || t.at > step.at)) step = { n: +k.slice(8), at: t.at };
    }
    /* the place and the "start from here" marker came from the same stale copy: go back to the first lesson not yet passed */
    if (dropped) { prog.start = 0; prog.step = 0; prog.at = SEQ[resumeFrom(0)].id; }
    if (at && at.at > mine && SEQ.some(x => x.id === at.id)) { prog.at = at.id; prog.step = step ? step.n : 0; }
    lastPushed.at = prog.at; lastPushed.step = prog.step || 0;
    synced = true;
    try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {}
  } catch (e) { synced = false; }
}
const idx = id => SEQ.findIndex(s => s.id === id);
/** an item is open when every quiz before it is passed */
function firstLocked() { const s0 = prog.start || 0; for (let i = s0; i < SEQ.length; i++) if (SEQ[i].quiz && !prog.passed[SEQ[i].id]) return i + 1; return SEQ.length; }
/* Final audit, 11 Nov 2026 (S11): what he really passed stays open wherever it sits in the list: a lesson whose quiz
   is passed, a passed quiz, and whatever comes next after it, up to the next quiz not yet passed. As before, the
   lessons before a "from here" start stay open for review, and nothing opens past a quiz that is not passed. */
function openSet() {
  const s0 = prog.start || 0, open = [];
  for (let i = 0; i < SEQ.length; i++) {
    const it = SEQ[i], nx = SEQ[i + 1], pv = SEQ[i - 1];
    const done = it.quiz ? !!prog.passed[it.id] : !!(nx && nx.quiz && prog.passed[nx.id]);
    open[i] = i === 0 || i <= s0 || done || (open[i - 1] && (!pv.quiz || !!prog.passed[pv.id]));
  }
  return open;
}
const isOpen = i => !!openSet()[i];

/* ---------- stage ---------- */
const stageEl = $("stage");
const S = E.createStage(stageEl);
const { renderer, scene, camera, controls } = S;
/* Final audit, 11 Nov 2026 (PICS P2, P3): the picture is re-sized whenever its area changes (the words under it change
   height with every step: before, the picture was stretched to fit). A picture narrower than 16:10 widens its viewing
   angle so it shows the same width a desktop does, instead of a narrow middle slice (the angle is capped at 95 degrees). */
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  if (!w || !h) return;
  const a = w / h;
  renderer.setSize(w, h, false); camera.aspect = a;
  camera.fov = a < 1.6 ? Math.min(95, 2 * Math.atan(Math.tan(20 * Math.PI / 180) * 1.6 / a) * 180 / Math.PI) : 40;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

let cur = null;        // { item, lesson, rig, root, tagEls }
let t = 0, playing = false, userCam = false, endShown = false;

function camAt(cams, t) {
  if (t <= cams[0][0]) return [cams[0][1], cams[0][2]];
  for (let i = 0; i < cams.length - 1; i++) {
    const [ta, pa, la] = cams[i], [tb, pb, lb] = cams[i + 1];
    if (t <= tb) { const k = ease((t - ta) / Math.max(1e-6, tb - ta)); return [pa.clone().lerp(pb, k), la.clone().lerp(lb, k)]; }
  }
  const l = cams[cams.length - 1]; return [l[1], l[2]];
}
const stepAt = (L, t) => { let s = 0; L.steps.forEach((x, i) => { if (t >= x.t0) s = i; }); return s; };

function apply(time, moveCam = true) {
  if (!cur || !cur.lesson) return;
  const L = cur.lesson; t = Math.max(0, Math.min(L.T, time));
  cur.rig.update(t);
  /* Final audit, 11 Nov 2026 (PICS P1): the lessons start each camera move 0.6 s before a step ends; the player waits at
     the end of a step, so the waiting picture was caught mid-move. The camera now follows 0.6 s behind the clock. */
  if (moveCam) { const [p, l] = camAt(cur.rig.cams, Math.max(0, t - 0.6)); camera.position.copy(p); controls.target.copy(l); camera.lookAt(l); }
  const si = stepAt(L, t);
  if (prog.at === cur.item.id && (prog.step || 0) !== si) { prog.step = si; save(); }
  const stp = L.steps[si];
  if (capKey !== cur.item.id + ":" + si + ":" + simpleFor + ":" + moreOpen) {
    capKey = cur.item.id + ":" + si + ":" + simpleFor + ":" + moreOpen;
    const pic = src => src ? `<img class="stepphoto" src="${src}" alt="Photo of your screen">` : "";
    $("cap").innerHTML = `<b>Step ${si + 1} of ${L.steps.length}.</b> ${gloss(stp.text)}` + pic(stp.photo) +
      (stp.why ? `<div class="why"><b>Why:</b> ${gloss(stp.why)}${stp.more ? `<span class="more" data-more>${moreOpen ? "Less ▴" : "More ▸"}</span>` : ""}</div>` : "") +
      (stp.more && moreOpen ? `<div class="moretext">${gloss(stp.more)}</div>` : "") +
      (simpleFor === si ? `<div class="simple"><b>In simpler words:</b> ${gloss(stp.simple || "Watch it once more, slowly.")}${pic(stp.simplePhoto || stp.photo)}` +
        `<div style="font-size:13px;margin-top:6px">Still stuck? Ask the guide's chat (<a href="../../index.html">← Guide</a>, bottom right), or send Claude a photo of what you see.</div></div>` : "");
  }
  [...$("steps").children].forEach((b, i) => b.classList.toggle("on", i === si));
  /* PHONES D2, D4: a new step starts with its words at the top, and its button is brought into the row's view. */
  if (shownStep !== cur.item.id + ":" + si) {
    shownStep = cur.item.id + ":" + si; $("panel").scrollTop = 0;
    const row = $("steps"), on = row.children[si];
    if (on) row.scrollLeft = on.offsetLeft - row.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  }
  $("time").textContent = t.toFixed(1) + " s"; $("scrub").value = t;
}
function placeTags() {
  if (!cur || !cur.lesson) return;
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  cur.rig.tags.forEach((tg, i) => {
    const el = cur.tagEls[i];
    if (!(t >= tg.from && t <= tg.to)) { el.style.display = "none"; return; }
    const p = tg.at().project(camera);
    if (p.z > 1 || Math.abs(p.x) > 1.1 || Math.abs(p.y) > 1.1) { el.style.display = "none"; return; }
    el.style.display = "block";
    /* Final audit, 11 Nov 2026 (NEW-4): keep the whole label inside the picture (it sits above its point, centred). */
    const half = el.offsetWidth / 2 + 4, x = (p.x + 1) / 2 * w, y = (1 - p.y) / 2 * h;
    el.style.left = (w > 2 * half ? Math.max(half, Math.min(w - half, x)) : w / 2) + "px";
    el.style.top = Math.max(el.offsetHeight + 14, y) + "px";
  });
}
let waiting = false;
let simpleFor = -1, speed = 1, moreOpen = false, capKey = "", shownStep = "";
/** underline the guide's glossary words in a caption (text only, never inside tags) */
function gloss(html) {
  // one pass over the plain text (never inside tags); whole words only; the first glossary entry that fits wins
  const re = new RegExp("\\b(" + GLOSSARY.map(g => "(?:" + g.re + ")").join("|") + ")\\b", "gi");
  return String(html).split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(re, m => {
    const i = GLOSSARY.findIndex(g => new RegExp("^(?:" + g.re + ")$", "i").test(m));
    return i < 0 ? m : `<span class="term" data-term="${i}">${m}</span>`;
  })).join("");
}
document.addEventListener("click", e => {
  const pop = $("termPop"), tEl = e.target.closest && e.target.closest(".term");
  if (tEl) { const g = GLOSSARY[+tEl.dataset.term]; pop.innerHTML = `<b>${g.term}:</b> ${g.def}`; const r = tEl.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(innerWidth - 330, r.left)) + "px"; pop.style.top = Math.max(8, r.top - 70) + "px"; pop.style.display = "block"; e.stopPropagation(); return; }
  pop.style.display = "none";
  if (e.target.matches && e.target.matches("[data-more]")) { moreOpen = !moreOpen; capKey = ""; apply(t, false); }
  if (e.target.matches && e.target.matches("img.stepphoto")) { const v = $("photoView"); v.querySelector("img").src = e.target.src; v.style.display = "flex"; }
});
$("photoView").onclick = () => { $("photoView").style.display = "none"; };
function setWaiting(w) { waiting = w; $("doneStep").style.display = $("dunno").style.display = w ? "" : "none"; }
function setPlaying(p) { playing = p; $("play").innerHTML = p ? "&#10074;&#10074;" : "&#9654;"; controls.enabled = !p; if (p) { userCam = false; setWaiting(false); } }

function clearCurrent() {
  if (!cur) return;
  if (cur.root) { scene.remove(cur.root); E.disposeTree(cur.root); }
  (cur.tagEls || []).forEach(el => el.remove());
  cur = null;
}

/* ---------- navigation ---------- */
/** first item at or after i that isn't done yet: a lesson is done when its own quiz (the next item) is passed */
function resumeFrom(i) {
  let j = Math.max(0, i);
  while (j < SEQ.length - 1) {
    const it = SEQ[j], nx = SEQ[j + 1];
    if (it.quiz ? prog.passed[it.id] : (nx && nx.quiz && prog.passed[nx.id])) j++; else break;
  }
  return j;
}
let welcomeBack = "";
async function go(id, { autoplay = true, fromLink = false } = {}) {
  let i = idx(id); if (i < 0) i = 0;
  if (fromLink) { const r = resumeFrom(i); if (r !== i) { welcomeBack = `Welcome back: you already passed up to here. (Open "All lessons" to watch an earlier one again.)`; i = r; id = SEQ[i].id; } }
  if (fromLink) { prog.start = i; save(); }   // "3D guide from here": start exactly where pressed
  let wanted = null;
  if (!isOpen(i)) { wanted = SEQ[i]; i = firstLocked() - 1; }   // can't skip past an unpassed quiz
  const item = SEQ[i];
  clearCurrent(); endShown = false; simpleFor = -1; speed = 1; moreOpen = false; capKey = "";
  $("endCard").classList.remove("on"); $("quizCard").classList.remove("on"); $("list").classList.remove("on");
  if (prog.at !== item.id) prog.step = 0;
  prog.at = item.id; save();
  if (location.hash !== "#" + item.id) history.replaceState(null, "", "#" + item.id);
  const inGrp = SEQ.filter(x => x.group === item.group && !x.quiz), k = inGrp.findIndex(x => x.id === item.id);
  const doneInGrp = inGrp.filter(x => { const j = idx(x.id); return SEQ[j + 1] && SEQ[j + 1].quiz && prog.passed[SEQ[j + 1].id]; }).length;
  $("grp").textContent = item.group + (k >= 0 ? ` · lesson ${k + 1} of ${inGrp.length} · ${doneInGrp} done ✓` : "") + (item.mins ? ` · about ${item.mins} min at the bench` : "");
  $("ttl").textContent = item.title;
  $("bar").firstElementChild.style.width = ((i + 1) / SEQ.length * 100) + "%";
  $("prev").disabled = i === 0;
  $("ctl").style.display = $("hint").style.display = item.quiz ? "none" : "";
  if (item.quiz) { cur = { item }; showQuiz(item); updateNext(); if (wanted) $("cap").innerHTML = `<b>Locked.</b> Pass this quiz first, then keep going to reach "${wanted.title}".`; return; }
  $("loading").style.display = "block";
  const L = (await item.load()).default;
  if (prog.at !== item.id) return;                  // the user moved on while it loaded
  const root = new THREE.Group(); scene.add(root);
  const rig = await L.build(E, root);
  if (prog.at !== item.id) { scene.remove(root); E.disposeTree(root); return; }
  cur = { item, lesson: L, rig, root, tagEls: rig.tags.map(tg => { const el = document.createElement("div"); el.className = "tag " + (tg.cls || ""); el.textContent = tg.text; el.style.display = "none"; stageEl.appendChild(el); return el; }) };
  $("loading").style.display = "none";
  $("scrub").max = L.T;
  $("steps").innerHTML = "";
  L.steps.forEach((s, k) => { const b = document.createElement("button"); b.textContent = "Step " + (k + 1); b.onclick = () => { setPlaying(false); userCam = false; $("endCard").classList.remove("on"); apply(s.t0 + 0.01); }; $("steps").appendChild(b); });
  const resumeStep = (resumeTo === item.id && prog.step > 0 && prog.step < L.steps.length) ? prog.step : 0;
  resumeTo = null;
  apply(resumeStep ? L.steps[resumeStep].t0 + 0.01 : 0); setPlaying(autoplay); updateNext();
  if (resumeStep) welcomeBack = `Picked up where you left off: step ${resumeStep + 1}.`;
  if (welcomeBack) { $("cap").innerHTML = `<b>${welcomeBack}</b> ` + $("cap").innerHTML; welcomeBack = ""; }
}
function updateNext() {
  const i = idx(cur.item.id);
  const nb = $("next");
  if (cur.item.quiz && !prog.passed[cur.item.id]) { nb.disabled = true; nb.innerHTML = "Answer the quiz to go on"; return; }
  nb.disabled = i >= SEQ.length - 1;
  nb.innerHTML = i >= SEQ.length - 1 ? "The end" : (SEQ[i + 1].quiz ? "Quiz &rarr;" : "Next &rarr;");
}
const goNext = () => { const i = idx(cur.item.id); if (i < SEQ.length - 1) go(SEQ[i + 1].id); };
$("next").onclick = goNext; $("endNext").onclick = goNext;
$("prev").onclick = () => { const i = idx(cur.item.id); if (i > 0) go(SEQ[i - 1].id); };
$("dunnoEnd").onclick = () => dontUnderstand(cur.lesson.steps.length - 1);
$("again").onclick = () => { $("endCard").classList.remove("on"); endShown = false; userCam = false; apply(0); setPlaying(true); };
$("play").onclick = () => { if (!cur || !cur.lesson) return; if (!playing && t >= cur.lesson.T - 0.01) { apply(0); $("endCard").classList.remove("on"); endShown = false; } setPlaying(!playing); };
$("doneStep").onclick = () => { const L = cur.lesson, si = stepAt(L, t); setWaiting(false); simpleFor = -1; speed = 1; if (si < L.steps.length - 1) apply(L.steps[si + 1].t0 + 0.001); setPlaying(true); };
/** "I don't understand": show the step in simpler words and play it again (slowly when there are no simpler words) */
function dontUnderstand(si) {
  const L = cur.lesson; simpleFor = si; speed = L.steps[si].simple ? 1 : 0.5;
  prog.confused = prog.confused || {}; prog.confused[cur.item.id + ":" + si] = (prog.confused[cur.item.id + ":" + si] || 0) + 1; save();
  setWaiting(false); $("endCard").classList.remove("on"); endShown = false; apply(L.steps[si].t0 + 0.001); setPlaying(true);
}
$("dunno").onclick = () => dontUnderstand(stepAt(cur.lesson, t));
try { $("straight").checked = localStorage.getItem("walkthrough-straight") === "1"; } catch (e) {}
$("straight").onchange = () => { try { localStorage.setItem("walkthrough-straight", $("straight").checked ? "1" : "0"); } catch (e) {} };
$("scrub").oninput = () => { setWaiting(false); setPlaying(false); userCam = false; $("endCard").classList.remove("on"); apply(+$("scrub").value); };
controls.addEventListener("start", () => { userCam = true; });

function showEnd() {
  endShown = true; prog.watched[cur.item.id] = true; save();
  const i = idx(cur.item.id), nx = SEQ[i + 1];
  $("endTitle").textContent = "Done: " + cur.item.title;
  $("endSub").textContent = nx ? (nx.quiz ? "Next is a short quiz. You need it right to go on." : "Next: " + nx.title) : "That is the last lesson so far.";
  $("endNext").style.display = nx ? "" : "none";
  $("endCard").classList.add("on");
}

/* ---------- quiz ---------- */
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function drawFinal(n = 20) {
  const pool = SEQ.filter(s => s.quiz && !s.final).flatMap(s => s.questions);
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}
function showQuiz(item) {
  const box = $("quizBox"); let qi = 0;
  if (item.final) item.questions = drawFinal();
  $("cap").innerHTML = "<b>Quick check.</b> Answer each question right to unlock the next lesson."; $("steps").innerHTML = ""; $("scrub").max = 1; $("scrub").value = 0; $("time").textContent = "";
  function render() {
    if (qi >= item.questions.length) {
      prog.passed[item.id] = true; save(); updateNext();
      const lessonsG = SEQ.filter(x => x.group === item.group && !x.quiz), passedG = lessonsG.filter(x => { const j = idx(x.id); return SEQ[j + 1] && SEQ[j + 1].quiz && prog.passed[SEQ[j + 1].id]; }).length;
      box.innerHTML = `<h2>Nice work! Quiz passed &#10003;</h2><div class="sub">${item.questions.length} of ${item.questions.length} right. ${item.final ? "You've passed the big final quiz." : `${item.group}: ${passedG} of ${lessonsG.length} lessons done.`} The next lesson is unlocked.</div><div class="row"><button class="btn" id="qGo">Next lesson &rarr;</button></div>`;
      $("qGo").onclick = goNext; prog.at = SEQ[Math.min(SEQ.length - 1, idx(item.id) + 1)].id; save(); return;
    }
    const q = item.questions[qi];
    const order = shuffle(q.options.map((o, k) => k));
    box.innerHTML = `<h2>Quick check</h2><div class="sub">Question ${qi + 1} of ${item.questions.length}${prog.passed[item.id] ? " &middot; already passed" : ""}</div>
      <div style="font-weight:600;font-size:17px">${q.q}</div>
      <div id="opts">${order.map(k => `<button class="opt" data-k="${k}">${q.options[k]}</button>`).join("")}</div>
      <div class="fb" id="fb"></div><div class="row" id="qRow"></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, fb = $("fb");
      if (k === q.answer) {
        b.classList.add("right"); box.querySelectorAll(".opt").forEach(x => x.disabled = true);
        fb.className = "fb right"; fb.innerHTML = "Right. " + q.why;
        $("qRow").innerHTML = `<button class="btn" id="qN">${qi + 1 < item.questions.length ? "Next question" : "Finish"} &rarr;</button>`;
        $("qN").onclick = () => { qi++; render(); };
      } else {
        b.classList.add("wrong"); box.querySelectorAll(".opt").forEach(x => x.disabled = true);
        fb.className = "fb wrong"; fb.innerHTML = "Not quite. " + q.why + "<br><b>The quiz starts again from question 1</b>: you pass by getting every question right in one go.";
        $("qRow").innerHTML = `<button class="btn" id="qRestart">Start the quiz again</button>` + (q.review && idx(q.review) >= 0 ? `<button class="btn ghost" id="qR">Watch the lesson again</button>` : "");
        $("qRestart").onclick = () => { qi = 0; if (item.final) item.questions = drawFinal(); render(); };
        if ($("qR")) $("qR").onclick = () => go(q.review);
      }
    });
  }
  render(); $("quizCard").classList.add("on");
}

/* ---------- lesson list ---------- */
function showList() {
  const L = $("list"); let html = "", grp = "";
  const fl = firstLocked();
  SEQ.forEach((s, i) => {
    if (s.group !== grp) { grp = s.group; html += `<h3>${grp}</h3>`; }
    const ico = s.quiz ? (prog.passed[s.id] ? "&#10003;" : "?") : (prog.watched[s.id] ? "&#10003;" : "&#9654;");
    const mins = s.mins ? ` <span style="color:var(--soft);font-size:13px">· ${s.mins} min</span>` : "";
    html += `<button data-id="${s.id}" ${!isOpen(i) ? "disabled" : ""} class="${cur && cur.item.id === s.id ? "here" : ""}"><span class="ico">${!isOpen(i) ? "&#128274;" : ico}</span><span>${s.quiz ? "Quiz: " : ""}${s.title}${mins}</span></button>`;
  });
  const left = SEQ.filter((s, i) => !s.quiz && s.mins && !(SEQ[i + 1] && SEQ[i + 1].quiz && prog.passed[SEQ[i + 1].id])).reduce((a, s) => a + s.mins, 0);
  L.innerHTML = `<div class="row" style="margin:0 0 6px"><button class="btn ghost" id="closeList">Close</button><a class="btn ghost" href="practice-radio.html" style="text-decoration:none">Practise on a pretend radio</a>${left ? `<span style="color:var(--soft)">About ${Math.round(left / 6) / 10} hours of bench work left (estimate)</span>` : ""}</div>` + html;
  L.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => go(b.dataset.id));
  $("closeList").onclick = () => L.classList.remove("on");
  L.classList.add("on");
}
$("openList").onclick = () => $("list").classList.contains("on") ? $("list").classList.remove("on") : showList();
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && (!cur || cur.item.id !== id)) go(id, { fromLink: true }); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (cur && cur.lesson) {
    if (playing) {
      const L = cur.lesson, si = stepAt(L, t), nt = t + dt * speed;
      if (!$("straight").checked && si < L.steps.length - 1 && nt >= L.steps[si + 1].t0) { apply(L.steps[si + 1].t0 - 0.001); setPlaying(false); setWaiting(true); }
      else { apply(nt); if (t >= L.T) { setPlaying(false); if (!endShown) showEnd(); } }
    }
    else if (userCam) controls.update();
    placeTags();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let resumeTo = null;
await pullSaved(); showSaved();
/* Final audit, 11 Nov 2026 (S11): opened without a link (the guide's top button), start at the first lesson not yet
   passed, on any browser. If that is the lesson he was in, pick up at its step. */
let startId = location.hash.slice(1);
const linked = !!startId;
if (!linked) {
  const first = resumeFrom(0);
  startId = SEQ[first].id;
  resumeTo = prog.at === startId ? startId : null;
  if (first > 0 && !resumeTo) welcomeBack = `Welcome back: you already passed up to here. (Open "All lessons" to watch an earlier one again.)`;
}
await go(startId, { autoplay: linked, fromLink: linked });

/* hooks for the automated check */
window.__wt = {
  ids: SEQ.map(s => s.id), errors,
  async go(id) { await go(id, { autoplay: false }); return cur.item.id; },
  setTime(x) { setPlaying(false); apply(x); placeTags(); renderer.render(scene, camera); return true; },
  state() { return { id: cur.item.id, quiz: !!cur.item.quiz, t, caption: $("cap").textContent, nextDisabled: $("next").disabled, lesson: cur.rig && cur.rig.state ? cur.rig.state(t) : null, errors }; },
  answer(text) { const b = [...document.querySelectorAll("#quizBox .opt")].find(x => x.textContent.trim() === text); if (!b) return "no such option"; b.click(); const n = document.getElementById("qN"); if (n) n.click(); return document.getElementById("fb") ? document.getElementById("fb").className : "done"; },
  restartQuiz() { const b = document.getElementById("qRestart"); if (b) b.click(); return !!b; },
  waiting() { return waiting; },
  playFor(ms) { setPlaying(true); return new Promise(r => setTimeout(() => r({ t, waiting }), ms)); },
  quizQuestions() { return cur && cur.item.quiz ? cur.item.questions : null; },
  quizText() { return document.getElementById("quizBox").innerText; },
  reset() { localStorage.removeItem(KEY); },
  setProgress(x) { prog = { at: prog.at, passed: {}, watched: {}, ...x }; save(); return true; },
  ready: true,
};
