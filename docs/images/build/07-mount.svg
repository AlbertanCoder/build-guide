<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Step 7: Mount the payload after the first hover, then balance</title>
<desc id="desc">Top view of the quad. On the top plate: the GPS, antenna up, in front of the battery; the battery on its grip pad behind it. Under the bottom plate: the thermal camera, lens down, just ahead of the Pi; the Pi and HAT behind the stack on a tape pad, held by zip ties and a strap. Prop circles stay clear.</desc>
<rect width="960" height="540" fill="#f7f2e8"/>
<style>.t{font:700 22px 'Segoe UI',sans-serif;fill:#123a2e}.s{font:17px 'Segoe UI',sans-serif;fill:#21332b}.b{fill:#fff;stroke:#1b5e4f;stroke-width:3;rx:12}.a{fill:#e4f0ea;stroke:#1b5e4f;stroke-width:3;rx:12}.w{fill:#fbe9dc;stroke:#c2571b;stroke-width:3;rx:12}.f{stroke:#123a2e;stroke-width:20;stroke-linecap:round}.p{fill:none;stroke:#9a700a;stroke-width:3;stroke-dasharray:8 7}.g{stroke:#1b5e4f;stroke-width:4;fill:none}</style>
<text x="32" y="40" class="t">7 · Mount the payload after the first hover, then balance</text>
<path d="M410 245 L265 155 M550 245 L695 155 M410 295 L265 385 M550 295 L695 385" class="f"/>
<circle cx="230" cy="140" r="65" class="p"/><circle cx="730" cy="140" r="65" class="p"/><circle cx="230" cy="400" r="65" class="p"/><circle cx="730" cy="400" r="65" class="p"/>
<text x="480" y="92" text-anchor="middle" class="s">▲ FRONT (camera end)</text><rect x="395" y="130" width="170" height="68" class="b"/><text x="480" y="160" text-anchor="middle" class="t">GPS ↑</text><text x="480" y="184" text-anchor="middle" class="s">antenna up</text>
<rect x="395" y="208" width="170" height="92" class="a"/><text x="480" y="242" text-anchor="middle" class="t">4S PACK</text><text x="480" y="270" text-anchor="middle" class="s">grip pad + strap</text>
<rect x="40" y="208" width="245" height="112" class="b"/><text x="58" y="240" class="t">ON THE TOP PLATE</text><text x="58" y="270" class="s">GPS in front of the pack</text><text x="58" y="298" class="s">Pack 2 mm behind the GPS</text>
<rect x="675" y="208" width="250" height="122" class="a"/><text x="693" y="238" class="t">UNDERNEATH</text><text x="693" y="264" class="s">Thermal ↓ ahead of the Pi</text><text x="693" y="288" class="s">Pi + HAT behind the stack</text><text x="693" y="312" class="s">Tape pad, zip ties, strap</text>
<path d="M285 264 H395 M565 264 H675" class="g"/>
<text x="480" y="430" text-anchor="middle" class="t">Balance on two fingers</text>
<rect x="170" y="455" width="620" height="58" class="w"/><text x="480" y="491" text-anchor="middle" class="t">No board touches carbon · no cable enters a prop circle</text>
</svg>