<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Step 8: Test in sequence before controlled flights</title>
<desc id="desc">Six stages in order: software tests and demo; bench power test; motor order and the Angle tilt test; props on and weigh; first hover of the bare drone; then the payload, tested on a mug of hot water. Never near a wildfire.</desc>
<rect width="960" height="540" fill="#f7f2e8"/>
<style>.t{font:700 21px 'Segoe UI',sans-serif;fill:#123a2e}.s{font:16px 'Segoe UI',sans-serif;fill:#21332b}.b{fill:#fff;stroke:#1b5e4f;stroke-width:3;rx:14}.a{fill:#e4f0ea;stroke:#1b5e4f;stroke-width:3;rx:14}.w{fill:#fbe9dc;stroke:#c2571b;stroke-width:3;rx:14}.g{stroke:#1b5e4f;stroke-width:4;fill:none}</style>
<text x="32" y="40" class="t">8 · Test in this order: each one only after the last passes</text>
<rect x="40" y="75" width="260" height="120" class="a"/><text x="170" y="110" text-anchor="middle" class="t">A · SOFTWARE</text><text x="170" y="142" text-anchor="middle" class="s">31 tests end with OK</text><text x="170" y="172" text-anchor="middle" class="s">Demo: plot of fake hotspots</text>
<rect x="350" y="75" width="260" height="120" class="a"/><text x="480" y="110" text-anchor="middle" class="t">B · BENCH POWER</text><text x="480" y="142" text-anchor="middle" class="s">Props off, smoke stopper</text><text x="480" y="172" text-anchor="middle" class="s">VTX light, picture, failsafe</text>
<rect x="660" y="75" width="260" height="120" class="a"/><text x="790" y="110" text-anchor="middle" class="t">C · MOTORS + ANGLE</text><text x="790" y="142" text-anchor="middle" class="s">Right motor, right way</text><text x="790" y="172" text-anchor="middle" class="s">Tilt test in Angle mode</text>
<path d="M300 135 H350 M610 135 H660" class="g"/>
<rect x="40" y="245" width="260" height="120" class="b"/><text x="170" y="280" text-anchor="middle" class="t">D · PROPS + WEIGH</text><text x="170" y="312" text-anchor="middle" class="s">CW: M1, M4 · CCW: M2, M3</text><text x="170" y="342" text-anchor="middle" class="s">Weigh it · NAV Drone check</text>
<rect x="350" y="245" width="260" height="120" class="b"/><text x="480" y="280" text-anchor="middle" class="t">E · FIRST HOVER</text><text x="480" y="312" text-anchor="middle" class="s">Bare drone, GNB, Angle on</text><text x="480" y="342" text-anchor="middle" class="s">1 m for 30 s, land, disarm</text>
<rect x="660" y="245" width="260" height="120" class="b"/><text x="790" y="280" text-anchor="middle" class="t">F · PAYLOAD</text><text x="790" y="312" text-anchor="middle" class="s">Mug of hot water at 50 cm</text><text x="790" y="342" text-anchor="middle" class="s">GPS line, then hover again</text>
<path d="M300 305 H350 M610 305 H660" class="g"/>
<rect x="150" y="415" width="660" height="75" class="w"/><text x="480" y="448" text-anchor="middle" class="t">Never near a wildfire: 5 nautical miles (9.3 km)</text><text x="480" y="477" text-anchor="middle" class="s">Pilot certificate + radio certificate + registration + NAV Drone check</text>
</svg>