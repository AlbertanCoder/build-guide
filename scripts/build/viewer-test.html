<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>viewer3d test page (check_viewer.js)</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .viewer3d { width: 640px; margin: 0 auto; }
  .viewer3d-canvas { position: relative; height: 360px; }
  .viewer3d-labels { position: absolute; inset: 0; pointer-events: none; }
  .gap { height: 1400px; }
</style>
<script>
  // ?phone=1: viewers at a phone column's size (ASSUMPTION: about Shad's iPhone page, 340 x 280 CSS px)
  if (new URLSearchParams(location.search).has("phone"))
    document.write("<style>.viewer3d { width: 340px; } .viewer3d-canvas { height: 280px; }</style>");
</script>
<script type="importmap">
{ "imports": { "three": "/docs/vendor/three/build/three.module.js", "three/addons/": "/docs/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="views"></div>
<script>
  // Same markup as index.html's viewers, one per model, far apart so only one is near the screen at a time.
  const models = ["step-01-parts", "step-02-frame", "step-03-stack", "step-04-receiver-fpv", "step-05-power",
                  "step-06-payload", "step-07-mount", "step-08-test", "final-product"];
  const host = document.getElementById("views");
  for (const m of models) {
    host.insertAdjacentHTML("beforeend",
      '<div class="gap"></div><div class="viewer3d" data-model="/docs/models/' + m + '.glb">' +
      '<div class="viewer3d-canvas"><div class="viewer3d-labels"></div><span class="viewer3d-status">Loading 3D</span></div>' +
      '<div class="viewer3d-bar"><span class="viewer3d-hint">hint</span>' +
      '<button type="button" data-action="reset">Reset view</button>' +
      '<button type="button" data-action="labels" aria-pressed="true">Labels</button></div></div>');
  }
  host.insertAdjacentHTML("beforeend", '<div class="gap"></div>');
</script>
<script type="module" src="/docs/js/viewer3d.js"></script>
<script type="module">
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const SHEETS = new URLSearchParams(location.search).has("sheets");
  const PHONE = new URLSearchParams(location.search).has("phone");
  function wrap(ctx, text, width) {
    const words = String(text).split(" "); const lines = []; let line = "";
    for (const w of words) { const tryLine = line ? line + " " + w : w;
      if (ctx.measureText(tryLine).width > width && line) { lines.push(line); line = w; } else line = tryLine; }
    if (line) lines.push(line); return lines;
  }
  /* Contact sheet: one frame per action, the action's own words under it, and the automatic check. */
  async function sheet(model, clip, frames) {
    const cols = 3, fw = 480, fh = 270, th = 118, pad = 14, head = 54;
    const rows = Math.ceil(frames.length / cols);
    const c = document.createElement("canvas");
    c.width = cols * (fw + pad) + pad; c.height = head + rows * (fh + th + pad) + pad;
    const g = c.getContext("2d");
    g.fillStyle = "#f7f2e8"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#1b5e4f"; g.font = "bold 22px sans-serif";
    g.fillText(model.split("/").pop() + "  -  clip " + clip + "  -  one frame per action (the action's labels and the close-up border are drawn as the viewer shows them)", pad, 34);
    for (let k = 0; k < frames.length; k += 1) {
      const f = frames[k]; const x = pad + (k % cols) * (fw + pad); const y = head + Math.floor(k / cols) * (fh + th + pad);
      const im = new Image(); im.src = f.img; await im.decode();
      g.drawImage(im, x, y, fw, fh);
      // the HTML parts a viewer shows on top of the picture: the close-up box border and the action's labels
      const sx = fw / (f.w || fw), sy = fh / (f.h || fh);
      if (f.inset) {
        const iw = f.inset * sx, ih = (f.inset / (4 / 3)) * sy;
        g.lineWidth = 3; g.strokeStyle = "#fff"; g.strokeRect(x + fw - 8 * sx - iw - 3, y + fh - 8 * sy - ih - 3, iw + 6, ih + 6);
        g.lineWidth = 4; g.strokeStyle = "#ff6a1a"; g.strokeRect(x + fw - 8 * sx - iw, y + fh - 8 * sy - ih, iw, ih);
      }
      g.font = "bold 11px sans-serif";
      for (const n of f.names || []) {
        const tw = g.measureText(n.text).width + 12, lx = x + n.x * sx - tw / 2, ly = y + n.y * sy - 22;
        g.fillStyle = "rgba(20,30,26,.9)"; g.fillRect(lx, ly, tw, 17);
        g.fillStyle = "#fff"; g.fillText(n.text, lx + 6, ly + 12.5);
      }
      g.strokeStyle = f.ok ? "#1b5e4f" : "#c2571b"; g.lineWidth = 3; g.strokeRect(x, y, fw, fh);
      g.fillStyle = "#222"; g.font = "bold 16px sans-serif";
      g.fillText((k + 1) + ". " + f.a.id + "  " + (f.a.short || "") + "  (" + f.t.toFixed(1) + " s)", x, y + fh + 20);
      g.font = "14px sans-serif";
      wrap(g, f.a.text || "", fw).slice(0, 4).forEach((ln, j) => g.fillText(ln, x, y + fh + 40 + j * 17));
      g.font = "bold 14px sans-serif"; g.fillStyle = f.ok ? "#1b5e4f" : "#c2571b";
      g.fillText(f.ok ? "Auto check PASS: named parts shown" + ((f.a.hides || []).length ? ", later parts hidden" : "")
                      : "Auto check FAIL: " + f.bad.join("; "), x, y + fh + th - 6);
    }
    return c.toDataURL("image/png");
  }
  const out = { steps: [], maxLive: 0, errors: [] };
  window.addEventListener("error", (e) => out.errors.push(String(e.message)));
  const live = () => window.BuildGuideViewer.stats().liveRenderers;
  async function waitReady(i, ms = 20000) {
    for (let t = 0; t < ms; t += 100) {
      const v = window.BuildGuideViewer.stats().viewers[i];
      if (v && v.ready) return v;
      out.maxLive = Math.max(out.maxLive, live());
      await sleep(100);
    }
    return window.BuildGuideViewer.stats().viewers[i];
  }
  (async () => {
    await sleep(500);
    const roots = [...document.querySelectorAll(".viewer3d")];
    for (let i = 0; i < roots.length; i += 1) {
      roots[i].scrollIntoView({ block: "center" });
      const v = await waitReady(i);
      await sleep(400);
      out.maxLive = Math.max(out.maxLive, live());
      const bar = roots[i].querySelector(".viewer3d-anim");
      const rec = { model: v && v.src, ready: !!(v && v.ready), clip: v && v.clip, duration: v && v.duration,
                    actions: v && v.actions, chips: v && v.chips, playing: v && v.playing, liveNow: live(),
                    hasBar: !!bar, reduced: matchMedia("(prefers-reduced-motion: reduce)").matches, hidden: document.hidden, canvases: document.querySelectorAll(".viewer3d-canvas canvas").length };
      if (bar) {
        // play -> time moves; pause -> time stops; scrub -> time set; chip -> jumps
        const slider = bar.querySelector("input[type=range]");
        const playBtn = bar.querySelector('[data-anim="play"]');
        if (rec.reduced) {   // reduced motion: no autoplay, still pose = the end of the clip
          rec.reducedNoAutoplay = !rec.playing;
          rec.reducedStartsAtEnd = Math.abs(Number(slider.value) - Number(slider.max)) < 0.05;
        }
        if (!window.BuildGuideViewer.stats().viewers[i].playing) playBtn.click();   // play
        slider.value = "0"; slider.dispatchEvent(new Event("input")); playBtn.click();  // restart from 0, playing
        const t0 = Number(slider.value); await sleep(700); const t1 = Number(slider.value);
        rec.timeMovesWhilePlaying = t1 > t0;
        if (PHONE) {                                   // the real page autoplays: the highlighted parts stay in frame while playing
          const pv = window.BuildGuideViewer.instances()[i], crop = [];
          for (const wait of [800, 2500]) {
            await sleep(wait);
            const fb = pv.focusBox && pv.focusBox();
            if (!fb || fb.isEmpty()) continue;
            const V = pv.camera.position.constructor; let outN = 0;
            for (let q = 0; q < 8; q++) { const v = new V(q & 1 ? fb.max.x : fb.min.x, q & 2 ? fb.max.y : fb.min.y, q & 4 ? fb.max.z : fb.min.z).project(pv.camera);
              if (Math.abs(v.x) > 1 || Math.abs(v.y) > 1) outN++; }
            if (outN) crop.push("t " + pv.currentTime().toFixed(1) + " s: " + outN + " of 8 corners outside");
            if (pv.arrow && pv.arrow.visible) crop.push("t " + pv.currentTime().toFixed(1) + " s: pointer arrow shown while playing");
          }
          rec.phonePlayCrop = crop;
        }
        playBtn.click();                                            // pause
        const p0 = Number(slider.value); await sleep(500); const p1 = Number(slider.value);
        rec.timeStopsWhenPaused = Math.abs(p1 - p0) < 1e-6;
        slider.value = "1.0"; slider.dispatchEvent(new Event("input"));
        rec.scrubSetsTime = Math.abs(Number(slider.value) - 1.0) < 0.05;
        const chips = bar.querySelectorAll(".viewer3d-chips button");
        if (chips.length) {
          chips[chips.length - 1].click();
          rec.lastChipActive = chips[chips.length - 1].classList.contains("is-active");
        }
      }
      // ---- every action: jump there, check the parts it names, capture a frame (sheet mode) ----
      const inst = window.BuildGuideViewer.instances()[i];
      rec.actionChecks = [];
      if (inst && inst.model) {
        rec.labelsOffByDefault = roots[i].querySelector(".viewer3d-labels").style.display === "none";
        let named = 0, total = 0;
        inst.model.traverse((o) => { if (o.isMesh && o.userData.kind !== "cone") { total += 1; if (o.userData.part) named += 1; } });
        rec.namedParts = [named, total];
        rec.views = [...roots[i].querySelectorAll(".viewer3d-views [data-view]")].map((b) => b.dataset.view);
        for (const k of ["pilot", "thermal"]) {
          if (inst.cones && inst.cones[k]) {
            inst.toggleView(k); inst.render();
            rec[k + "Inset"] = inst.insetShown;
            rec[k + "ConeVisible"] = inst.cones[k].visible;
            if (k === "pilot" && inst.tiltInput) {
              const p = new inst.camera.position.constructor();
              inst.viewCam.getWorldDirection(p); const before = p.y;
              inst.tiltInput.value = "30"; inst.tiltInput.dispatchEvent(new Event("input"));
              inst.viewCam.getWorldDirection(p); rec.tiltRaisesView = p.y > before + 0.1;
              inst.tiltInput.value = inst.tiltPivot.userData.default; inst.tiltInput.dispatchEvent(new Event("input"));
            }
            inst.toggleView(k);
          }
        }   // how much of the frame the default view fills (NDC: 1.0 = edge)
        inst.action("reset");
        let wx = 0, wy = 0; const v3 = new inst.camera.position.constructor();
        inst.model.updateWorldMatrix(true, true);
        inst.model.traverse((o) => {
          if (!o.isMesh || o.userData.kind === 'cone') return;
          const pos = o.geometry.attributes.position;
          for (let q = 0; q < pos.count; q += Math.max(1, Math.floor(pos.count / 60))) {
            v3.fromBufferAttribute(pos, q).applyMatrix4(o.matrixWorld).project(inst.camera);
            wx = Math.max(wx, Math.abs(v3.x)); wy = Math.max(wy, Math.abs(v3.y));
          }
        });
        rec.fill = [Number(wx.toFixed(2)), Number(wy.toFixed(2))];
        rec.aspect = Number(inst.camera.aspect.toFixed(2));
      }
      const frames = [];
      for (let k = 0; inst && inst.actionList && k < inst.actionList.length; k += 1) {
        const a = inst.actionList[k];
        inst.action("reset");
        const dDesign = a.dist || inst.camera.position.distanceTo(inst.controls.target) * 0.45;
        inst.jumpTo(k);
        await sleep(60);
        if (PHONE && inst.camEaseDone) await inst.camEaseDone;   // phone: the camera eases in on the part first
        const find = (pre) => { const hit = []; inst.model.traverse((o) => { if (o.isMesh && o.name.startsWith(pre)) hit.push(o); }); return hit; };
        // scale as drawn, parents included: a solder joint is a child of its wire, so it is hidden when the wire is
        inst.model.updateMatrixWorld(true);
        const ws = (o) => o.getWorldScale(new inst.camera.position.constructor()).x / inst.model.getWorldScale(new inst.camera.position.constructor()).x;
        const bad = [];
        for (const pre of a.shows || []) {
          const h = find(pre);
          if (!h.length) bad.push("missing " + pre);
          else if (h.some((o) => ws(o) < 0.9)) bad.push(pre + " not fully shown");
        }
        for (const pre of a.hides || []) {
          if (find(pre).some((o) => ws(o) > 0.01)) bad.push(pre + " visible too early");
        }
        // visibility aids: focus outline, close-up inset, and ember pixels really on screen
        let ember = 0;
        if ((a.shows || []).length) {
          inst.render();
          const im = new Image(); im.src = inst.renderer.domElement.toDataURL("image/png"); await im.decode();
          const cv = document.createElement("canvas"); cv.width = im.width; cv.height = im.height;
          const g2 = cv.getContext("2d"); g2.drawImage(im, 0, 0);
          const px = g2.getImageData(0, 0, cv.width, cv.height).data;
          for (let q = 0; q < px.length; q += 4) {
            if (px[q] > 190 && px[q + 1] > 60 && px[q + 1] < 160 && px[q + 2] < 90) ember += 1;
          }
          if (!inst.focusParts || !inst.focusParts.length) bad.push("focus did not outline the parts");
          // a close-up box only as a TRUE zoom (2x or more); none is right when the part already fills the view
          if (inst.insetShown === "Close-up" && !inst.phoneNeedsCloseup && !(inst.insetZoom >= 2)) bad.push("close-up is not a 2x zoom (" + inst.insetZoom + ")");
          if (!PHONE && inst.insetShown !== "Close-up" && !(inst.focusFill >= 0.15)) bad.push("no close-up and the part is small (" + inst.focusFill + ")");
          if (PHONE) {                                   // phone: no close-up box, at most 3 labels, none touching, readable
            if (inst.insetShown === "Close-up" && !inst.phoneNeedsCloseup) bad.push("close-up box on a phone-width viewer");
            if (inst.focusIsOverview && inst.arrow && inst.arrow.visible) bad.push("pointer arrow shown on a phone overview step");
            if (inst.insetShown === "Close-up") rec.phoneCloseups = (rec.phoneCloseups || []).concat(a.id);
            const ir = inst.insetRect;
            if (ir) for (const l of inst.actShown || []) if (l.box && l.box.l < ir.r && l.box.r > ir.l && l.box.t < ir.b && l.box.b > ir.t) bad.push("label touches the close-up box: " + l.text);
            const sh = inst.actShown || [];
            if (sh.length > 3) bad.push(sh.length + " labels at once on a phone");
            for (let i = 0; i < sh.length; i++) for (let j = i + 1; j < sh.length; j++) {
              const p = sh[i].box, q = sh[j].box;
              if (!p || !q) bad.push("label box not measured");
              else if (p.l < q.r && p.r > q.l && p.t < q.b && p.b > q.t) bad.push("labels overlap: " + sh[i].text + " / " + sh[j].text);
            }
            const lab = inst.actHost && inst.actHost.querySelector(".viewer3d-actlabel");
            if (lab && parseFloat(getComputedStyle(lab).fontSize) < 14) bad.push("phone label text under 14 px");
            if (a.focus) {                               // the step's own camera move shows at least its 16:9 width
              const d = inst.camera.position.distanceTo(inst.controls.target);
              if (d * inst.camera.aspect < dDesign * (16 / 9) * 0.98) bad.push("authored view narrower on phone than designed (" + (d * inst.camera.aspect).toFixed(3) + " < " + (dDesign * 16 / 9).toFixed(3) + ")");
            }
            // the highlighted group is fully in the frame (the Builder's Step 1 shot was cropped by the move-in)
            const fb = inst.focusBox && inst.focusBox();
            if (fb && !fb.isEmpty()) {
              const V = inst.camera.position.constructor, out = [];
              for (let q = 0; q < 8; q++) {
                const v = new V(q & 1 ? fb.max.x : fb.min.x, q & 2 ? fb.max.y : fb.min.y, q & 4 ? fb.max.z : fb.min.z).project(inst.camera);
                if (Math.abs(v.x) > 1 || Math.abs(v.y) > 1) out.push(q);
              }
              if (out.length) bad.push("highlighted parts cut off at the frame edge (" + out.length + " of 8 corners outside)");
            }
          }
          // labels start OFF, but the action names what it is about
          if (!(inst.actShown || []).length) bad.push("nothing named in the frame");
          if (ember < 40) bad.push("outline not visible on screen (" + ember + " px)");
        }
        rec.actionChecks.push({ id: a.id, ok: bad.length === 0, bad, t: Number(inst.currentTime().toFixed(2)), ember,
                                aids: (a.shows || []).length ? ["focus outline", "arrow", "close-up inset"].concat(a.focus ? ["camera move"] : []) : ["(no part to show)"] });
        if (SHEETS) {
          inst.render();
          frames.push({ img: inst.renderer.domElement.toDataURL("image/jpeg", 0.88), a, ok: bad.length === 0, bad,
                        t: inst.currentTime(), names: (inst.actShown || []).slice(),
                        w: inst.canvasHost.clientWidth, h: inst.canvasHost.clientHeight,
                        inset: inst.insetShown === "Close-up" ? Math.round(Math.min(inst.canvasHost.clientWidth * 0.38, 300)) : 0 });
        }
      }
      if (PHONE && i === 0 && inst && inst.ready) {        // phone 3D speed: lighter settings, and ms per render of Step 1
        const t0 = performance.now(); for (let q = 0; q < 30; q++) inst.render();
        rec.phoneSpeed = { msPerRender: +((performance.now() - t0) / 30).toFixed(2), shadows: inst.renderer.shadowMap.enabled,
          pixelRatio: inst.renderer.getPixelRatio(), calls: inst.renderer.info.render.calls };
      }
      if (PHONE && i === 0 && inst && inst.actionList && inst.actionList.length) {   // phone: labels show after a tap, then fade
        inst.jumpTo(0); await sleep(300);
        const shown = inst.actHost && !inst.actHost.classList.contains("is-faded");
        await sleep(3300);
        rec.phoneLabelsFade = shown && inst.actHost.classList.contains("is-faded");
      }
      if (SHEETS && frames.length) rec.sheet = await sheet(rec.model, rec.clip, frames);
      out.steps.push(rec);
    }
    // scroll back to the first: it must come back (re-init after release)
    roots[0].scrollIntoView({ block: "center" });
    const back = await waitReady(0);
    out.reinitFirst = !!(back && back.ready);
    out.finalLive = live();
    out.done = true;
    await fetch("/report", { method: "POST", body: JSON.stringify(out) });
  })();
</script>
</body>
