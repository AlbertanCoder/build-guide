<title id="title">Step 6: Connect the Pi, thermal camera and GPS</title>
<desc id="desc">Pi Zero 2 WH with Qwiic HAT, two PRT-17912 jumper cables to 1x5 headers on MLX90640 and PA1010D. Cable colors and sensor orientation are labelled.</desc>
